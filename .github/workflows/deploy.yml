name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# No workflow-level permissions — each job requests only what it needs, so the
# build job never holds a token that can write Pages or mint an OIDC identity.
# `npm ci --ignore-scripts` below closes the install-script vector, but the
# build itself still executes third-party code (Next, PostCSS, Tailwind and
# their transitive deps all run at build time), so the scoping still earns
# its keep.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't persist the GITHUB_TOKEN in .git/config, where any code
          # running later in this job — including third-party build-time
          # dependencies — could read it.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts: no package in the lockfile declares an install
      # script, so this costs nothing today and stops a compromised
      # transitive dependency from executing code in the build job tomorrow.
      - run: npm ci --ignore-scripts
      - run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
