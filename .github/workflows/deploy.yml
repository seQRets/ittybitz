name: Deploy to GitHub Pages

# IttyBitz is a static single-file site: site/index.html is the app, plus the
# standalone recovery tool, the CNAME and a .nojekyll. There is nothing to
# build — this workflow just publishes the site/ directory verbatim. No npm,
# no dependencies, no third-party build-time code runs here.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write        # to deploy to Pages
      id-token: write      # to verify the deployment originates from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Publishes site/ as the root of the Pages site. site/CNAME carries the
      # ittybitz.app custom domain; site/.nojekyll disables Jekyll processing.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
