version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current. Dependabot updates both the
  # pinned commit SHA and the trailing version comment, one grouped PR at a
  # time. (There is no npm section: IttyBitz has no npm dependencies.)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
