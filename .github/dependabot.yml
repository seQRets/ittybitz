version: 2
updates:
  # Keep npm dependencies patched (this was previously implicit via repo
  # settings; making it explicit alongside the github-actions ecosystem).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

    # Routine minor/patch updates arrive as ONE consolidated PR per week
    # rather than one PR per package. Without this, the default open-PR
    # limit of 5 turns a backlog into a queue that refills the moment it is
    # cleared: emptying five PRs on 2026-08-11 caused Dependabot to open the
    # next five two minutes later, with six more still waiting behind those.
    #
    # Majors are deliberately left ungrouped so each one gets its own PR and
    # its own review — that is where breaking changes live (see the TS 7 and
    # tailwind-merge 3 history below).
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

    # Raised from the default 5 so an ungrouped major never gets starved out
    # by the grouped PR occupying a slot.
    open-pull-requests-limit: 10

    ignore:
      # TypeScript 7 is the native (tsgo) port and drops the JS compiler API
      # that `next build` requires, so it cannot be adopted while Next.js
      # depends on it (see PR #22, closed 2026-07-26; PR #28 re-proposed the
      # identical version because the base moved 5.9.3 -> 6.0.3). Minor and
      # patch updates within TypeScript 6 still come through normally.
      # Remove this once Next.js supports the TS 7 compiler API.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # Keep the SHA-pinned GitHub Actions current. Dependabot updates both the
  # pinned commit SHA and the trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
